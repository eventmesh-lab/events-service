services:
  postgres:
    image: postgres:16
    container_name: events-postgres
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: events-rabbitmq
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Puerto Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-emulator:
    image: spine3/firebase-emulator
    container_name: events-firebase
    environment:
      # Iniciar solo Storage. Usamos un proyecto ID dummy 'eventmesh-local'
      - ARGS=--project=eventmesh-local emulators:start --only storage --import=/opt/data --export-on-exit=/opt/data
    ports:
      - "4000:4000" # UI Emulator
      - "9199:9199" # Storage Emulator
    volumes:
      - ./firebase_data:/opt/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: events-api:local
    container_name: events-api
    ports:
      - "5000:8080"
      - "5001:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__EventsDb=Host=postgres;Port=5432;Database=events;Username=events;Password=events
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Exchange=eventos.domain.events
      - MessageBroker__Username=guest
      - MessageBroker__Password=guest
      # Configuración para Firebase Emulator
      - STORAGE_EMULATOR_HOST=http://firebase-emulator:9199
      - FirebaseStorage__ProjectId=eventmesh-local
      - FirebaseStorage__BucketName=eventmesh-local.appspot.com
      - FirebaseStorage__PublicBaseUrl=http://localhost:9199/v0/b/eventmesh-local.appspot.com/o
    depends_on:
      - postgres
      - rabbitmq
      - firebase-emulator

volumes:
  postgres_data:
  rabbitmq_data:
